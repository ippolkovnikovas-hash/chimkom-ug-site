<!DOCTYPE html>
<html>
<head>
    <title>Page Title</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <form class="reg-form" method="post">
        <h1>Регистрация на конференцию</h1>
        <div class="mb-3">
            <label for="name" class="form-label">Фамилия, имя, отчество:</label>
            <input type="text" id="name" name="name" class="reg-form__input form-control">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">E-mail:</label>
            <input type="email" id="email" name="email" class="reg-form__input form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Пол:</label>
            <div>
                <label><input type="radio" name="sex" value="male"> мужской </label>
                <label><input type="radio" name="sex" value="female"> женский </label>
            </div>
            
        </div>
        <div class="mb-3">
            <label class="form-label">Предпочтительное время выступления:</label>
            <div>
                <label><input type="checkbox" name="time_morning" value="1">утро</label>
                <label><input type="checkbox" name="time_afternoon" value="1">день</label>
                <label><input type="checkbox" name="time_evening" value="1">вечер</label>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Секция:</label>
            <select name="section" class="reg-form__input">
                <option value="frontend">Frontend</option>
                <option value="backend">Backend</option>
                <option value="management">Менеджмент</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Тема и тезисы выступления:</label>
            <textarea name="info" class="reg-form__input form-control"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Презентация:</label>
            <input type="file" name="presentation" class="form-control">
        </div>
       <div class="mb-3">
            <input type="reset" value="Сбросить">
            <input type="submit" value="Отправить">
       </div>
    </form>
